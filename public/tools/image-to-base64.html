<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to Base64 - ToolBox LK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="bi bi-tools text-primary"></i>
                ToolBox <span class="text-primary">LK</span>
            </a>
            <a href="../index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="text-center mb-4">
                        <div class="hero-icon mb-3">
                            <i class="bi bi-file-code"></i>
                        </div>
                        <h1 class="fw-bold">Image to Base64</h1>
                        <p class="text-secondary">Convert an image into a Base64 string for easy embedding or API use.</p>
                    </div>

                    <div class="tool-card">
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Choose image</label>
                            <input type="file" id="imageFile" class="form-control form-control-lg" accept="image/*">
                        </div>

                        <button id="convertBtn" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-arrow-repeat"></i>
                            Convert to Base64
                        </button>

                        <div class="mt-4">
                            <label class="form-label fw-semibold">Base64 output</label>
                            <textarea id="base64Output" class="form-control" rows="8" readonly placeholder="Your encoded text will appear here..."></textarea>
                        </div>

                        <div class="mt-3 d-flex flex-wrap gap-2">
                            <button id="copyBtn" class="btn btn-success" type="button">
                                <i class="bi bi-clipboard"></i>
                                Copy
                            </button>
                            <button id="clearBtn" class="btn btn-outline-secondary" type="button">
                                <i class="bi bi-x-circle"></i>
                                Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const imageFile = document.getElementById('imageFile');
        const convertBtn = document.getElementById('convertBtn');
        const base64Output = document.getElementById('base64Output');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        convertBtn.addEventListener('click', () => {
            const file = imageFile.files[0];
            if (!file) {
                base64Output.value = 'Please choose an image first.';
                return;
            }

            const reader = new FileReader();
            reader.onload = () => {
                base64Output.value = String(reader.result);
            };
            reader.onerror = () => {
                base64Output.value = 'Could not read the selected image.';
            };
            reader.readAsDataURL(file);
        });

        copyBtn.addEventListener('click', async () => {
            const text = base64Output.value;
            if (!text) return;

            try {
                await navigator.clipboard.writeText(text);
                copyBtn.innerHTML = '<i class="bi bi-clipboard-check"></i> Copied';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="bi bi-clipboard"></i> Copy';
                }, 1200);
            } catch (error) {
                base64Output.select();
            }
        });

        clearBtn.addEventListener('click', () => {
            imageFile.value = '';
            base64Output.value = '';
        });
    </script>
</body>
</html>
