<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Video Converter - ToolBox LK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="bi bi-tools text-primary"></i>
                ToolBox <span class="text-primary">LK</span>
            </a>
            <a href="../index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="text-center mb-4">
                        <div class="hero-icon mb-3">
                            <i class="bi bi-link-45deg"></i>
                        </div>
                        <h1 class="fw-bold">Social Video Converter</h1>
                        <p class="text-secondary">Paste a public social media or video URL and convert it to MP4 or MP3.</p>
                    </div>

                    <div class="tool-card">
                        <form id="socialVideoForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Video URL</label>
                                <input type="url" id="videoUrl" class="form-control form-control-lg" placeholder="https://example.com/video" required>
                                <div class="form-text">Use a public URL you have permission to download.</div>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Output format</label>
                                    <select id="outputFormat" class="form-select form-select-lg">
                                        <option value="mp4">MP4</option>
                                        <option value="mp3">MP3</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Quality</label>
                                    <select id="videoQuality" class="form-select form-select-lg">
                                        <option value="720p">720p</option>
                                        <option value="480p">480p</option>
                                        <option value="1080p">1080p</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100" id="convertBtn">
                                <i class="bi bi-arrow-repeat"></i>
                                Convert Video
                            </button>
                        </form>

                        <div class="mt-4 d-none" id="progressArea">
                            <div class="text-center mb-3">
                                <span id="statusText" class="fw-semibold">Checking public link...</span>
                            </div>
                            <div class="progress-steps d-flex justify-content-between gap-2 mb-3">
                                <div class="progress-step active">Check link</div>
                                <div class="progress-step">Download</div>
                                <div class="progress-step">Convert</div>
                                <div class="progress-step">Ready</div>
                            </div>
                            <div class="progress">
                                <div class="progress-bar progress-bar-striped progress-bar-animated" id="progressBar" style="width: 25%"></div>
                            </div>
                        </div>

                        <div class="alert alert-success mt-4 d-none" id="downloadArea">
                            <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                                <div>
                                    <i class="bi bi-check-circle-fill"></i>
                                    Conversion completed.
                                </div>
                                <a id="downloadLink" class="btn btn-success" download>
                                    <i class="bi bi-download"></i>
                                    Download file
                                </a>
                            </div>
                        </div>

                        <div class="alert alert-danger mt-4 d-none" id="errorArea"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const form = document.getElementById('socialVideoForm');
        const videoUrlInput = document.getElementById('videoUrl');
        const outputFormatSelect = document.getElementById('outputFormat');
        const qualitySelect = document.getElementById('videoQuality');
        const convertBtn = document.getElementById('convertBtn');
        const progressArea = document.getElementById('progressArea');
        const statusText = document.getElementById('statusText');
        const downloadArea = document.getElementById('downloadArea');
        const downloadLink = document.getElementById('downloadLink');
        const errorArea = document.getElementById('errorArea');
        const progressBar = document.getElementById('progressBar');
        const progressSteps = Array.from(document.querySelectorAll('.progress-step'));

        function setProgressState(stepIndex, label, widthPercent) {
            progressSteps.forEach((item, index) => {
                item.classList.toggle('active', index === stepIndex);
                item.classList.toggle('done', index < stepIndex);
            });

            statusText.textContent = label;
            progressBar.style.width = `${widthPercent}%`;
        }

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            const url = videoUrlInput.value.trim();
            const format = outputFormatSelect.value;
            const quality = qualitySelect.value;

            if (!url) {
                errorArea.innerHTML = '<strong>Please paste a valid video URL first.</strong><div class="mt-2">Use a public direct video link or a video page URL that allows downloading.</div>';
                errorArea.classList.remove('d-none');
                return;
            }

            convertBtn.disabled = true;
            progressArea.classList.remove('d-none');
            downloadArea.classList.add('d-none');
            errorArea.classList.add('d-none');
            setProgressState(0, 'Checking public link...', 25);

            try {
                setTimeout(() => setProgressState(1, 'Downloading video...', 50), 400);
                setTimeout(() => setProgressState(2, `Converting to ${format.toUpperCase()} (${quality})...`, 75), 900);

                const response = await fetch('/api/convert/social-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, format, quality })
                });

                const contentType = response.headers.get('content-type') || '';
                let data = null;

                if (contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    const responseText = await response.text();
                    throw new Error(responseText || 'The server returned an invalid response.');
                }

                if (!response.ok) {
                    throw new Error(data.message || 'Video conversion failed.');
                }

                setProgressState(3, 'Ready to download', 100);
                statusText.textContent = 'Ready to download';
                downloadLink.href = data.downloadUrl;
                downloadLink.setAttribute('download', data.filename || 'toolbox-social-video');
                downloadArea.classList.remove('d-none');
                progressArea.classList.add('d-none');
            } catch (error) {
                setProgressState(0, 'Download failed', 100);
                errorArea.innerHTML = `
                    <strong>Unable to download this video.</strong>
                    <div class="mt-2">${error.message || 'This link may be private, restricted, or not a direct public video URL.'}</div>
                    <div class="mt-2">Try a different public URL, use a direct video link, or switch the output format.</div>
                `;
                errorArea.classList.remove('d-none');
                progressArea.classList.add('d-none');
            } finally {
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
