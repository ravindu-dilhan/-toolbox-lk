<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MP4 to MP3 - ToolBox LK</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">

            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="bi bi-tools text-primary"></i>
                ToolBox <span class="text-primary">LK</span>
            </a>

            <a href="../index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>

        </div>
    </nav>


    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-7">

                    <div class="text-center mb-4">

                        <div class="hero-icon mb-3">
                            <i class="bi bi-music-note-beamed"></i>
                        </div>

                        <h1 class="fw-bold">
                            MP4 to MP3 Converter
                        </h1>

                        <p class="text-secondary">
                            Convert your video file into MP3 audio.
                        </p>

                    </div>


                    <div class="tool-card">

                        <form id="converterForm">

                            <div class="mb-4">

                                <label class="form-label fw-semibold">
                                    Select MP4 Video
                                </label>

                                <input type="file" class="form-control form-control-lg" id="videoFile"
                                    accept="video/mp4" required>

                                <div class="form-text">
                                    Select an MP4 file you own or have permission to process.
                                </div>

                            </div>


                            <button type="submit" class="btn btn-primary btn-lg w-100" id="convertBtn">
                                <i class="bi bi-arrow-repeat"></i>
                                Convert to MP3
                            </button>

                        </form>


                        <div class="mt-4 d-none" id="progressArea">

                            <div class="text-center mb-2">
                                <span id="statusText">
                                    Converting...
                                </span>
                            </div>

                            <div class="progress">

                                <div class="progress-bar progress-bar-striped progress-bar-animated"
                                    style="width: 100%">
                                </div>

                            </div>

                        </div>


                        <div class="alert alert-success mt-4 d-none" id="downloadArea">

                            <i class="bi bi-check-circle-fill"></i>

                            Conversion completed!

                            <a id="downloadLink" class="btn btn-success" download>
                                <i class="bi bi-download"></i>
                                Download MP3
                            </a>



                        </div>


                        <div class="alert alert-danger mt-4 d-none" id="errorArea"></div>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <script>

        const form = document.getElementById("converterForm");
        const fileInput = document.getElementById("videoFile");

        const convertBtn = document.getElementById("convertBtn");

        const progressArea = document.getElementById("progressArea");
        const downloadArea = document.getElementById("downloadArea");
        const downloadLink = document.getElementById("downloadLink");

        const errorArea = document.getElementById("errorArea");


        form.addEventListener("submit", async function (event) {

            event.preventDefault();

            const file = fileInput.files[0];

            if (!file) {
                errorArea.textContent = "Please choose an MP4 file before converting.";
                errorArea.classList.remove("d-none");
                return;
            }

            const formData = new FormData();

            formData.append("video", file);

            convertBtn.disabled = true;

            progressArea.classList.remove("d-none");
            downloadArea.classList.add("d-none");
            errorArea.classList.add("d-none");

            try {
                const response = await fetch("/api/convert/mp4-to-mp3", {
                    method: "POST",
                    body: formData
                });

                const contentType = response.headers.get("content-type") || "";
                let data = null;

                if (contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    const responseText = await response.text();
                    throw new Error(
                        responseText || "Server returned an unexpected response."
                    );
                }

                if (!response.ok) {
                    throw new Error(data.message || "Conversion failed.");
                }

                if (!data || !data.downloadUrl) {
                    throw new Error("The server did not return a download link.");
                }

                if (!data.downloadUrl) {
                    throw new Error("The server did not return a download link.");
                }

                downloadLink.href = data.downloadUrl;
                downloadLink.setAttribute("download", "converted-audio.mp3");
                downloadArea.classList.remove("d-none");
                progressArea.classList.add("d-none");
            } catch (error) {
                progressArea.classList.add("d-none");
                errorArea.textContent = error.message;
                errorArea.classList.remove("d-none");
            } finally {
                convertBtn.disabled = false;
            }
        });

    </script>

</body>

</html>
