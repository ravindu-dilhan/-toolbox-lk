<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - ToolBox LK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="bi bi-tools text-primary"></i>
                ToolBox <span class="text-primary">LK</span>
            </a>
            <a href="../index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="text-center mb-4">
                        <div class="hero-icon mb-3">
                            <i class="bi bi-qr-code"></i>
                        </div>
                        <h1 class="fw-bold">QR Code Generator</h1>
                        <p class="text-secondary">Generate a QR code for a website, text, or any content.</p>
                    </div>

                    <div class="tool-card">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Text or URL</label>
                            <textarea id="qrText" class="form-control" rows="4" placeholder="https://example.com or any text"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Size</label>
                            <input type="range" id="qrSize" class="form-range" min="180" max="420" value="260">
                            <div class="text-secondary small">Size: <span id="qrSizeValue">260</span> px</div>
                        </div>

                        <button id="generateBtn" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-qr-code-scan"></i>
                            Generate QR Code
                        </button>

                        <div id="qrError" class="alert alert-danger d-none mt-3"></div>

                        <div class="mt-4 text-center d-none" id="qrOutputWrap">
                            <img id="qrOutput" class="img-fluid rounded border p-3 bg-white" alt="Generated QR code">
                            <div class="mt-3">
                                <a id="downloadQr" class="btn btn-success" download>
                                    <i class="bi bi-download"></i>
                                    Download QR Code
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../js/qrcode.min.js"></script>
    <script>
        const qrText = document.getElementById('qrText');
        const qrSize = document.getElementById('qrSize');
        const qrSizeValue = document.getElementById('qrSizeValue');
        const generateBtn = document.getElementById('generateBtn');
        const qrOutputWrap = document.getElementById('qrOutputWrap');
        const qrOutput = document.getElementById('qrOutput');
        const downloadQr = document.getElementById('downloadQr');

        const qrError = document.getElementById('qrError');
        if (!window.QRCode) {
            if (qrError) {
                qrError.textContent = 'QR library failed to load — try reloading the page.';
                qrError.classList.remove('d-none');
            }
        }

        qrSize.addEventListener('input', () => {
            qrSizeValue.textContent = qrSize.value;
        });

        async function generateQrCode() {
            const text = qrText.value.trim();
            if (!text) {
                qrOutputWrap.classList.add('d-none');
                return;
            }

            if (!window.QRCode) {
                if (qrError) {
                    qrError.textContent = 'QR library is unavailable. Cannot generate a QR code.';
                    qrError.classList.remove('d-none');
                }
                qrOutputWrap.classList.add('d-none');
                return;
            }

            try {
                const canvas = document.createElement('canvas');
                const size = Number(qrSize.value);
                canvas.width = size;
                canvas.height = size;

                await QRCode.toCanvas(canvas, text, {
                    width: size,
                    margin: 2,
                    color: {
                        dark: '#111827',
                        light: '#ffffff'
                    }
                });

                const dataUrl = canvas.toDataURL('image/png');
                qrOutput.src = dataUrl;
                downloadQr.href = dataUrl;
                downloadQr.download = 'toolboxlk-qr-code.png';
                qrOutputWrap.classList.remove('d-none');
            } catch (error) {
                if (qrError) {
                    qrError.textContent = error.message || 'Failed to generate QR code.';
                    qrError.classList.remove('d-none');
                }
                qrOutputWrap.classList.add('d-none');
            }
        }

        generateBtn.addEventListener('click', generateQrCode);
        qrText.addEventListener('input', () => {
            const text = qrText.value.trim();
            if (text) {
                generateQrCode();
            } else {
                qrOutputWrap.classList.add('d-none');
            }
        });

        qrText.value = 'https://toolboxlk.example';
        generateQrCode();
    </script>
</body>
</html>
