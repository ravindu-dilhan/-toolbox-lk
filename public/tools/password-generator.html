<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator - ToolBox LK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="bi bi-tools text-primary"></i>
                ToolBox <span class="text-primary">LK</span>
            </a>
            <a href="../index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="text-center mb-4">
                        <div class="hero-icon mb-3">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <h1 class="fw-bold">Password Generator</h1>
                        <p class="text-secondary">Generate a secure password with your preferred settings.</p>
                    </div>

                    <div class="tool-card">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Length</label>
                            <input type="range" id="lengthRange" class="form-range" min="8" max="32" value="16">
                            <div class="text-secondary small">Length: <span id="lengthValue">16</span> characters</div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeUppercase" checked>
                                    <label class="form-check-label" for="includeUppercase">Uppercase</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeLowercase" checked>
                                    <label class="form-check-label" for="includeLowercase">Lowercase</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeNumbers" checked>
                                    <label class="form-check-label" for="includeNumbers">Numbers</label>
                                </div>
                            </div>
                            <div class="col-md-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="includeSymbols" checked>
                                    <label class="form-check-label" for="includeSymbols">Symbols</label>
                                </div>
                            </div>
                        </div>

                        <button id="generateBtn" class="btn btn-primary btn-lg w-100">
                            <i class="bi bi-shuffle"></i>
                            Generate Password
                        </button>

                        <div class="mt-4">
                            <label class="form-label fw-semibold">Generated Password</label>
                            <div class="input-group input-group-lg">
                                <input id="passwordOutput" type="text" class="form-control" readonly>
                                <button id="copyBtn" class="btn btn-outline-primary" type="button">
                                    <i class="bi bi-clipboard"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const lengthRange = document.getElementById('lengthRange');
        const lengthValue = document.getElementById('lengthValue');
        const includeUppercase = document.getElementById('includeUppercase');
        const includeLowercase = document.getElementById('includeLowercase');
        const includeNumbers = document.getElementById('includeNumbers');
        const includeSymbols = document.getElementById('includeSymbols');
        const passwordOutput = document.getElementById('passwordOutput');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');

        lengthRange.addEventListener('input', () => {
            lengthValue.textContent = lengthRange.value;
        });

        generateBtn.addEventListener('click', generatePassword);
        copyBtn.addEventListener('click', async () => {
            const password = passwordOutput.value;
            if (!password) return;

            try {
                await navigator.clipboard.writeText(password);
                copyBtn.innerHTML = '<i class="bi bi-clipboard-check"></i>';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="bi bi-clipboard"></i>';
                }, 1200);
            } catch (error) {
                passwordOutput.select();
            }
        });

        function generatePassword() {
            const length = Number(lengthRange.value);
            const lower = 'abcdefghijklmnopqrstuvwxyz';
            const upper = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const numbers = '0123456789';
            const symbols = '!@#$%^&*()_+-=[]{}|;:,.<>?';

            const charSet = [
                includeLowercase.checked ? lower : '',
                includeUppercase.checked ? upper : '',
                includeNumbers.checked ? numbers : '',
                includeSymbols.checked ? symbols : ''
            ].join('');

            if (!charSet) {
                passwordOutput.value = 'Select at least one character type.';
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * charSet.length);
                password += charSet[randomIndex];
            }

            passwordOutput.value = password;
        }

        generatePassword();
    </script>
</body>
</html>
