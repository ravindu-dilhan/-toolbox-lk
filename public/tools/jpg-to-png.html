<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG to PNG - ToolBox LK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="bi bi-tools text-primary"></i>
                ToolBox <span class="text-primary">LK</span>
            </a>
            <a href="../index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-7">
                    <div class="text-center mb-4">
                        <div class="hero-icon mb-3">
                            <i class="bi bi-image"></i>
                        </div>
                        <h1 class="fw-bold">JPG to PNG Converter</h1>
                        <p class="text-secondary">Convert JPEG or JPG images to PNG while keeping your quality.</p>
                    </div>

                    <div class="tool-card">
                        <form id="jpgToPngForm">
                            <div class="mb-4">
                                <label class="form-label fw-semibold">Choose JPG image</label>
                                <input type="file" class="form-control form-control-lg" id="imageFile" accept="image/*" required>
                            </div>
                            <button type="submit" class="btn btn-primary btn-lg w-100" id="convertBtn">
                                <i class="bi bi-arrow-repeat"></i>
                                Convert to PNG
                            </button>
                        </form>

                        <div class="alert alert-success mt-4 d-none" id="resultArea">
                            <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
                                <div>
                                    <i class="bi bi-check-circle-fill"></i>
                                    Conversion complete.
                                </div>
                                <a id="downloadLink" class="btn btn-success" download>
                                    <i class="bi bi-download"></i>
                                    Download PNG
                                </a>
                            </div>
                        </div>

                        <div class="alert alert-danger mt-4 d-none" id="errorArea"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const form = document.getElementById('jpgToPngForm');
        const fileInput = document.getElementById('imageFile');
        const convertBtn = document.getElementById('convertBtn');
        const resultArea = document.getElementById('resultArea');
        const downloadLink = document.getElementById('downloadLink');
        const errorArea = document.getElementById('errorArea');

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            const file = fileInput.files[0];

            if (!file) {
                errorArea.textContent = 'Please select an image file first.';
                errorArea.classList.remove('d-none');
                return;
            }

            convertBtn.disabled = true;
            errorArea.classList.add('d-none');
            resultArea.classList.add('d-none');

            try {
                const dataUrl = await readFileAsDataUrl(file);
                const image = await loadImage(dataUrl);
                const canvas = document.createElement('canvas');
                canvas.width = image.naturalWidth;
                canvas.height = image.naturalHeight;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(image, 0, 0);

                const blob = await canvasToBlob(canvas, 'image/png');
                const url = URL.createObjectURL(blob);

                downloadLink.href = url;
                downloadLink.download = `${file.name.replace(/\.[^.]+$/, '') || 'converted'}-converted.png`;
                resultArea.classList.remove('d-none');
            } catch (error) {
                errorArea.textContent = error.message || 'Image conversion failed.';
                errorArea.classList.remove('d-none');
            } finally {
                convertBtn.disabled = false;
            }
        });

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Could not read the selected file.'));
                reader.readAsDataURL(file);
            });
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('The selected file is not a valid image.'));
                img.src = src;
            });
        }

        function canvasToBlob(canvas, type) {
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (!blob) return reject(new Error('PNG export failed.'));
                    resolve(blob);
                }, type);
            });
        }
    </script>
</body>
</html>
