<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Case Converter - ToolBox LK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="bi bi-tools text-primary"></i>
                ToolBox <span class="text-primary">LK</span>
            </a>
            <a href="../index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="text-center mb-4">
                        <div class="hero-icon mb-3">
                            <i class="bi bi-type"></i>
                        </div>
                        <h1 class="fw-bold">Text Case Converter</h1>
                        <p class="text-secondary">Transform your text into different letter cases instantly.</p>
                    </div>

                    <div class="tool-card">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Your text</label>
                            <textarea id="inputText" class="form-control" rows="8" placeholder="Type or paste your text here..."></textarea>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <button class="btn btn-primary w-100" data-case="upper">UPPERCASE</button>
                            </div>
                            <div class="col-md-6">
                                <button class="btn btn-outline-primary w-100" data-case="lower">lowercase</button>
                            </div>
                            <div class="col-md-6">
                                <button class="btn btn-outline-primary w-100" data-case="title">Title Case</button>
                            </div>
                            <div class="col-md-6">
                                <button class="btn btn-outline-primary w-100" data-case="sentence">Sentence case</button>
                            </div>
                        </div>

                        <div class="mt-4">
                            <label class="form-label fw-semibold">Converted text</label>
                            <textarea id="outputText" class="form-control" rows="8" readonly></textarea>
                        </div>

                        <div class="mt-3 d-flex flex-wrap gap-2">
                            <button id="copyBtn" class="btn btn-success" type="button">
                                <i class="bi bi-clipboard"></i>
                                Copy
                            </button>
                            <button id="clearBtn" class="btn btn-outline-secondary" type="button">
                                <i class="bi bi-x-circle"></i>
                                Clear
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const inputText = document.getElementById('inputText');
        const outputText = document.getElementById('outputText');
        const copyBtn = document.getElementById('copyBtn');
        const clearBtn = document.getElementById('clearBtn');

        document.querySelectorAll('[data-case]').forEach((button) => {
            button.addEventListener('click', () => {
                const text = inputText.value;
                if (!text) {
                    outputText.value = '';
                    return;
                }

                const mode = button.dataset.case;
                outputText.value = convertCase(text, mode);
            });
        });

        copyBtn.addEventListener('click', async () => {
            const text = outputText.value;
            if (!text) return;

            try {
                await navigator.clipboard.writeText(text);
                copyBtn.innerHTML = '<i class="bi bi-clipboard-check"></i> Copied';
                setTimeout(() => {
                    copyBtn.innerHTML = '<i class="bi bi-clipboard"></i> Copy';
                }, 1200);
            } catch (error) {
                outputText.select();
            }
        });

        clearBtn.addEventListener('click', () => {
            inputText.value = '';
            outputText.value = '';
            inputText.focus();
        });

        function convertCase(value, mode) {
            if (mode === 'upper') return value.toUpperCase();
            if (mode === 'lower') return value.toLowerCase();
            if (mode === 'title') {
                return value.toLowerCase().replace(/\b\w/g, (char) => char.toUpperCase());
            }
            if (mode === 'sentence') {
                return value.toLowerCase().replace(/(^\s*\w|[.!?]\s+\w)/g, (char) => char.toUpperCase());
            }
            return value;
        }
    </script>
</body>
</html>
