<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Compressor - ToolBox LK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="../index.html">
                <i class="bi bi-tools text-primary"></i>
                ToolBox <span class="text-primary">LK</span>
            </a>
            <a href="../index.html" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left"></i>
                Back
            </a>
        </div>
    </nav>

    <section class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="text-center mb-4">
                        <div class="hero-icon mb-3">
                            <i class="bi bi-file-earmark-zip"></i>
                        </div>
                        <h1 class="fw-bold">Image Compressor</h1>
                        <p class="text-secondary">Reduce the file size of your image while keeping good quality.</p>
                    </div>

                    <div class="tool-card">
                        <form id="compressForm">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Choose image</label>
                                <input type="file" class="form-control form-control-lg" id="imageFile" accept="image/*" required>
                            </div>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Quality</label>
                                    <input type="range" class="form-range" id="qualityRange" min="10" max="90" value="65">
                                    <div class="text-secondary small"><span id="qualityValue">65</span>% quality</div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-semibold">Max width</label>
                                    <input type="number" class="form-control" id="maxWidth" min="100" max="2000" value="1200">
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 mt-4" id="compressBtn">
                                <i class="bi bi-download"></i>
                                Compress Image
                            </button>
                        </form>

                        <div class="alert alert-success mt-4 d-none" id="resultArea">
                            <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
                                <div>
                                    <i class="bi bi-check-circle-fill"></i>
                                    Compressed image ready.
                                </div>
                                <a id="downloadLink" class="btn btn-success" download>
                                    <i class="bi bi-download"></i>
                                    Download
                                </a>
                            </div>
                        </div>

                        <div class="alert alert-danger mt-4 d-none" id="errorArea"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const form = document.getElementById('compressForm');
        const fileInput = document.getElementById('imageFile');
        const qualityRange = document.getElementById('qualityRange');
        const qualityValue = document.getElementById('qualityValue');
        const maxWidthInput = document.getElementById('maxWidth');
        const resultArea = document.getElementById('resultArea');
        const downloadLink = document.getElementById('downloadLink');
        const errorArea = document.getElementById('errorArea');
        const compressBtn = document.getElementById('compressBtn');

        qualityRange.addEventListener('input', () => {
            qualityValue.textContent = qualityRange.value;
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();
            const file = fileInput.files[0];

            if (!file) {
                errorArea.textContent = 'Please select an image first.';
                errorArea.classList.remove('d-none');
                return;
            }

            compressBtn.disabled = true;
            errorArea.classList.add('d-none');
            resultArea.classList.add('d-none');

            try {
                const dataUrl = await readFileAsDataUrl(file);
                const image = await loadImage(dataUrl);
                const maxWidth = Number(maxWidthInput.value) || 1200;
                const quality = Number(qualityRange.value) / 100;

                const scale = Math.min(1, maxWidth / image.naturalWidth);
                const canvas = document.createElement('canvas');
                canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
                canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));

                const ctx = canvas.getContext('2d');
                ctx.drawImage(image, 0, 0, canvas.width, canvas.height);

                const blob = await canvasToBlob(canvas, 'image/jpeg', quality);
                const url = URL.createObjectURL(blob);

                downloadLink.href = url;
                downloadLink.download = `${file.name.replace(/\.[^.]+$/, '') || 'compressed'}-compressed.jpg`;
                resultArea.classList.remove('d-none');
            } catch (error) {
                errorArea.textContent = error.message || 'Compression failed.';
                errorArea.classList.remove('d-none');
            } finally {
                compressBtn.disabled = false;
            }
        });

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(new Error('Could not read the image file.'));
                reader.readAsDataURL(file);
            });
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('The selected file is not a valid image.'));
                img.src = src;
            });
        }

        function canvasToBlob(canvas, type, quality) {
            return new Promise((resolve, reject) => {
                canvas.toBlob((blob) => {
                    if (!blob) return reject(new Error('Image compression failed.'));
                    resolve(blob);
                }, type, quality);
            });
        }
    </script>
</body>
</html>
